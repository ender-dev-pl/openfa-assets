name: Verify canonical assets and main-branch Pages content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-publication.txt
      - run: python tools/verify_publication.py
      - name: Ensure media verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python tools/test_publication.py
      - run: python tools/test_public_pages.py
      - run: python tools/test_extension_missiles.py
      - run: python tools/test_missile_silo_correction.py
      - run: python sources/ui/camera-mode-icon/verify_camera_mode_icon.py
      - run: python tools/verify_project.py
      - run: python tools/test_canonical_assets.py
      - run: python tools/test_archive_evidence.py
      - run: python -m unittest discover -s tools -p 'test_achaean*evidence.py'
      - run: python tools/test_mobile_remaster_evidence.py
      - run: python tools/test_culture_building_evidence.py
      - run: python tools/test_mauna_type6_verifier_io.py
      - run: python tools/test_mauna_mobile_remasters.py
      - run: python tools/verify_licensing.py
      - run: python tools/test_licensing.py
      - run: node tools/test_gallery_filters.cjs
      - run: node tools/test_catalogue_filters.cjs
      - run: python tools/build_public_pages.py --output docs/pages --check-existing
