name: Verify public assets and prepare Pages content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Update gh-pages content and request a configured Pages build
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-publication.txt
      - run: python tools/verify_publication.py
      - run: python tools/test_publication.py
      - run: python tools/test_public_pages.py
      - run: python tools/verify_project.py
      - run: python -m unittest discover -s tools -p 'test_achaean*evidence.py'
      - run: python tools/test_mobile_remaster_evidence.py
      - run: python tools/test_mauna_type6_verifier_io.py
      - run: python tools/test_mauna_mobile_remasters.py
      - run: python tools/verify_licensing.py
      - run: python tools/test_licensing.py
      - run: node tools/test_gallery_filters.cjs
      - run: node tools/test_catalogue_filters.cjs
      - run: python tools/build_public_pages.py --repository "${{ github.repository }}"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_public_pages.py --repository "${{ github.repository }}" --ref "${{ github.sha }}"
      - name: Authenticate Git for the content branch
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Update content and request Pages build
        run: python tools/publish_public_pages.py --repository "${{ github.repository }}" --request-build
        env:
          GH_TOKEN: ${{ github.token }}
